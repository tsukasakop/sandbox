name: PR Preview Deployments

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

permissions:
  deployments: write
  contents: read

jobs:
  preview-dev:
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'preview-dev') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview-dev'))
    runs-on: ubuntu-latest
    concurrency:
      group: preview-dev-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-${context.payload.pull_request.number}`,
              auto_merge: false,
              required_contexts: []
            });
            return deployment.data.id;

      - name: Set status to in_progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'in_progress'
            });

      - name: Fake deploy step
        run: echo "deploying to dev... (commit ${{ github.event.pull_request.head.sha }})"

      - name: Set status to success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://example.com/dev/pr-${{ github.event.pull_request.number }}'
            });

  preview-stage:
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'preview-stage') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview-stage'))
    runs-on: ubuntu-latest
    environment: stage
    concurrency:
      group: preview-stage-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'stage',
              auto_merge: false,
              required_contexts: []
            });
            return deployment.data.id;

      - name: Set status to in_progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'in_progress'
            });

      - name: Fake deploy step
        run: echo "deploying to stage... (commit ${{ github.event.pull_request.head.sha }})"

      - name: Set status to success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://example.com/stage'
            });

  teardown:
    if: github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment inactive
        uses: actions/github-script@v7
        with:
          script: |
            const map = { 'preview-dev': `pr-${context.payload.pull_request.number}`, 'preview-stage': 'stage' };
            const envName = map[context.payload.label.name];
            if (!envName) return;
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: envName
            });
            for (const d of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
                state: 'inactive'
              });
            }
